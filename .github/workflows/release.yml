name: Publish GitHub Release (Windows & macOS)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Executable
        run: flutter build windows --release
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"

      - name: Compress Windows Release
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath QLCSKB_Windows_x64.zip

      - name: Upload Windows Asset
        uses: actions/upload-artifact@v4
        with:
          name: QLCSKB_Windows_x64
          path: QLCSKB_Windows_x64.zip

  build-macos:
    name: Build macOS Release
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Enable macOS Desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS App
        run: flutter build macos --release

      - name: Compress macOS Release
        run: |
          cd build/macos/Build/Products/Release
          zip -r ../../../../../QLCSKB_macOS.zip qlcskb.app

      - name: Upload macOS Asset
        uses: actions/upload-artifact@v4
        with:
          name: QLCSKB_macOS
          path: QLCSKB_macOS.zip

  create-release:
    name: Create GitHub Release
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: QLCSKB_Windows_x64
          path: ./release_assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: QLCSKB_macOS
          path: ./release_assets

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./release_assets/QLCSKB_Windows_x64.zip
            ./release_assets/QLCSKB_macOS.zip
          generate_release_notes: true
          draft: false
          prerelease: false
